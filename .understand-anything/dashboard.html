<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quark 知识图谱仪表盘</title>
<style>
  :root { --bg:#0d1117; --fg:#c9d1d9; --acc:#58a6ff; --dim:#8b949e; --border:#30363d; --card:#161b22; --hot:#f85149; --warn:#d29922; --ok:#3fb950; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--fg); }
  header { background:var(--card); border-bottom:1px solid var(--border); padding:12px 20px; position:sticky; top:0; z-index:100; }
  header h1 { font-size:16px; color:var(--acc); margin-bottom:4px; }
  header .meta { font-size:11px; color:var(--dim); }
  nav { display:flex; gap:2px; padding:0 20px; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:49px; z-index:99; }
  nav a { color:var(--dim); text-decoration:none; padding:8px 14px; font-size:12px; border-bottom:2px solid transparent; cursor:pointer; }
  nav a:hover { color:var(--fg); }
  nav a.active { color:var(--acc); border-bottom-color:var(--acc); }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:16px; }
  .card h3 { font-size:14px; color:var(--acc); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; padding:2px 6px; border-radius:3px; background:#1f2937; color:var(--dim); }
  .badge.complex { background:#490202; color:var(--hot); }
  .badge.moderate { background:#3d2800; color:var(--warn); }
  .badge.simple { background:#033a16; color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; padding:6px 10px; border-bottom:2px solid var(--border); color:var(--dim); font-weight:600; }
  td { padding:6px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:hover { background:#1c2128; }
  .tags span { display:inline-block; background:#1f2937; color:var(--dim); padding:1px 6px; border-radius:3px; margin:1px; font-size:10px; }
  .layer-card { border-left:3px solid var(--acc); padding-left:14px; }
  .layer-card h4 { margin-bottom:6px; }
  .layer-card p { color:var(--dim); font-size:12px; margin-bottom:8px; }
  .tour-step { border-left:3px solid var(--ok); padding:8px 14px; margin-bottom:10px; border-radius:0 6px 6px 0; }
  .tour-step .step-num { font-weight:700; color:var(--acc); margin-right:6px; }
  .edge-row { font-family:monospace; font-size:11px; }
  #tab-content { display:none; }
  #tab-content.active { display:block; }
  .filter-bar { margin-bottom:12px; }
  .filter-bar input { background:var(--bg); border:1px solid var(--border); color:var(--fg); padding:6px 10px; border-radius:4px; width:300px; font-size:12px; }
  .edge-type { display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; }
  .edge-type.imports,.edge-type.exports { background:#0c2d6b; color:#58a6ff; }
  .edge-type.calls { background:#3d2800; color:#d29922; }
  .edge-type.contains,.edge-type.inherits { background:#033a16; color:#3fb950; }
  .edge-type.depends_on { background:#2d1040; color:#bc8cff; }
  .hotspot { color:var(--hot); font-weight:700; }
</style>
</head>
<body>
<header>
  <h1 id="proj-name">AMD Quark · 知识图谱</h1>
  <div class="meta" id="proj-meta"></div>
</header>
<nav>
  <a class="active" onclick="switchTab('overview',this)">概览</a>
  <a onclick="switchTab('layers',this)">架构层 (12)</a>
  <a onclick="switchTab('nodes',this)">节点 (52)</a>
  <a onclick="switchTab('edges',this)">关系 (49)</a>
  <a onclick="switchTab('tour',this)">导览 (10)</a>
</nav>
<main>
  <div id="tab-overview" class="active tab-content"></div>
  <div id="tab-layers" class="tab-content"></div>
  <div id="tab-nodes" class="tab-content"></div>
  <div id="tab-edges" class="tab-content"></div>
  <div id="tab-tour" class="tab-content"></div>
</main>

<script>
let G = {};
fetch('/api/graph').then(r=>r.json()).then(g=>{G=g;render();}).catch(e=>document.body.innerHTML=`<h2 style="padding:40px;color:var(--hot)">无法加载 knowledge-graph.json。请运行：<br><code>python3 -m http.server 8765</code> 然后访问 <a href="http://127.0.0.1:8765/.understand-anything/dashboard.html">http://127.0.0.1:8765/.understand-anything/dashboard.html</a><br><br>错误: ${e}</h2>`);

function switchTab(name,el){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(el) el.classList.add('active');
}

function render(){
  document.getElementById('proj-meta').textContent = `${G.project.languages.join(', ')} · ${G.project.frameworks.join(', ')} · ${G.project.gitCommitHash?.slice(0,7)}`;
  renderOverview();
  renderLayers();
  renderNodes();
  renderEdges();
  renderTour();
}

function renderOverview(){
  const d = document.getElementById('tab-overview');
  const complexNodes = G.nodes.filter(n=>n.complexity>=8).sort((a,b)=>b.complexity-a.complexity);
  const typeCount = {}; G.nodes.forEach(n=>{typeCount[n.type]= (typeCount[n.type]||0)+1;});
  d.innerHTML = `
    <div class="card">
      <h3>📊 项目信息</h3>
      <p style="color:var(--dim);font-size:12px;line-height:1.6">${G.project.description}</p>
      <div style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap">
        <div><span style="color:var(--dim)">节点</span> <b>${G.nodes.length}</b></div>
        <div><span style="color:var(--dim)">边</span> <b>${G.edges.length}</b></div>
        <div><span style="color:var(--dim)">架构层</span> <b>${G.layers.length}</b></div>
        <div><span style="color:var(--dim)">导览步骤</span> <b>${G.tour.length}</b></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        ${Object.entries(typeCount).map(([t,c])=>`<span class="badge">${t}: ${c}</span>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3>🔥 复杂度热点 (Top ${Math.min(8,complexNodes.length)})</h3>
      <table>
        <tr><th>模块</th><th>路径</th><th>复杂度</th></tr>
        ${complexNodes.slice(0,8).map(n=>`<tr>
          <td><b>${n.name}</b><br><span style="color:var(--dim);font-size:11px">${n.summary.slice(0,60)}...</span></td>
          <td style="font-family:monospace;font-size:11px">${n.filePath||'-'}</td>
          <td class="hotspot">${'🔴'.repeat(Math.min(5,n.complexity/2))} ${n.complexity}</td>
        </tr>`).join('')}
      </table>
    </div>`;
}

function renderLayers(){
  const d = document.getElementById('tab-layers');
  d.innerHTML = G.layers.map(l=>`
    <div class="card layer-card">
      <h4>${l.name} <span class="badge">${l.nodeIds.length} 节点</span></h4>
      <p>${l.description}</p>
      <div class="tags">
        ${(l.keyFiles||[]).map(f=>`<span>📄 ${f}</span>`).join(' ')}
      </div>
    </div>
  `).join('');
}

function renderNodes(){
  const d = document.getElementById('tab-nodes');
  const nodeMap = {}; G.nodes.forEach(n=>nodeMap[n.id]=n);
  const edgeCountByNode = {};
  G.edges.forEach(e=>{edgeCountByNode[e.source]=(edgeCountByNode[e.source]||0)+1;edgeCountByNode[e.target]=(edgeCountByNode[e.target]||0)+1;});
  const layerMap = {}; G.layers.forEach(l=>l.nodeIds.forEach(id=>layerMap[id]=l.name));
  
  let html = `<div class="filter-bar"><input id="node-filter" placeholder="搜索节点..." oninput="filterNodes()"></div>
  <div class="card" style="overflow-x:auto"><table id="node-table">
  <tr><th>名称</th><th>类型</th><th>架构层</th><th>关系数</th><th>复杂度</th><th>描述</th></tr>`;
  G.nodes.forEach(n=>{
    const cc = {8:'complex',5:'moderate',1:'simple'};
    let cx = 'simple'; if(n.complexity>=8) cx='complex'; else if(n.complexity>=5) cx='moderate';
    html += `<tr data-search="${n.name} ${n.summary} ${(n.tags||[]).join(' ')}">
      <td><b>${n.name}</b><br><span style="font-family:monospace;font-size:10px;color:var(--dim)">${n.id}</span></td>
      <td><span class="badge">${n.type}</span></td>
      <td style="color:var(--acc);font-size:11px">${layerMap[n.id]||'-'}</td>
      <td>${edgeCountByNode[n.id]||0}</td>
      <td><span class="badge ${cx}">${'🔴'.repeat(Math.ceil(n.complexity/3))} ${n.complexity}</span></td>
      <td style="font-size:11px;color:var(--dim);max-width:300px">${n.summary}</td></tr>`;
  });
  html += '</table></div>';
  d.innerHTML = html;
}

function filterNodes(){
  const q = document.getElementById('node-filter').value.toLowerCase();
  document.querySelectorAll('#node-table tr[data-search]').forEach(tr=>{
    tr.style.display = tr.dataset.search.toLowerCase().includes(q) ? '' : 'none';
  });
}

function renderEdges(){
  const d = document.getElementById('tab-edges');
  const nodeMap = {}; G.nodes.forEach(n=>nodeMap[n.id]=n.name);
  const byType = {}; G.edges.forEach(e=>{byType[e.type]= (byType[e.type]||0)+1;});
  
  let html = `<div class="filter-bar"><input id="edge-filter" placeholder="搜索关系..." oninput="filterEdges()"></div>
  <div class="card" style="margin-bottom:8px">
    <div class="tags">${Object.entries(byType).map(([t,c])=>`<span class="edge-type ${t}">${t}: ${c}</span>`).join(' ')}</div>
  </div>
  <div class="card" style="overflow-x:auto"><table id="edge-table">
  <tr><th>源</th><th>关系</th><th>目标</th></tr>`;
  G.edges.forEach(e=>{
    html += `<tr data-search="${e.type} ${nodeMap[e.source]} ${nodeMap[e.target]}" class="edge-row">
      <td>${nodeMap[e.source]||e.source}</td>
      <td><span class="edge-type ${e.type}">${e.type}</span></td>
      <td>${nodeMap[e.target]||e.target}</td></tr>`;
  });
  html += '</table></div>';
  d.innerHTML = html;
}

function filterEdges(){
  const q = document.getElementById('edge-filter')?.value.toLowerCase()||'';
  document.querySelectorAll('#edge-table tr[data-search]').forEach(tr=>{
    tr.style.display = tr.dataset.search.toLowerCase().includes(q) ? '' : 'none';
  });
}

function renderTour(){
  const d = document.getElementById('tab-tour');
  const nodeMap = {}; G.nodes.forEach(n=>nodeMap[n.id]=n.name);
  d.innerHTML = `<p style="color:var(--dim);margin-bottom:16px">推荐学习路径，从上到下依次阅读</p>` + G.tour.map(t=>`
    <div class="tour-step card" style="border-left-color:hsl(${t.order*36},70%,50%)">
      <h4><span class="step-num">${t.order}.</span>${t.title}</h4>
      <p style="color:var(--dim);font-size:12px;margin:6px 0">${t.description}</p>
      <div style="margin-top:8px;font-size:11px;color:var(--acc)">
        关联节点: ${t.nodeIds.map(id=>`<span class="badge">${nodeMap[id]||id}</span>`).join(' ')}
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
